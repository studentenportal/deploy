---
- name: Create studentenportal user
  ansible.builtin.user:
    name: studentenportal
    state: present
    groups: docker
    shell: /usr/sbin/nologin

- name: Open firewall ports
  ansible.builtin.include_role: name=firewall tasks_from=open-port
  vars:
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80 # HTTP
    - 443 # HTTPS

- name: Install docker environment file
  ansible.builtin.template:
    src: studentenportal.env
    dest: /home/studentenportal/studentenportal.env
    owner: studentenportal
    group: studentenportal
    mode: "0600"

- name: Clone studentenportal web repository
  ansible.builtin.git:
    repo: https://github.com/studentenportal/web/
    dest: /home/studentenportal/web
  become: true
  become_user: studentenportal

- name: Create data directories
  ansible.builtin.file:
    path: "/home/studentenportal/{{ item.name }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
  loop:
    - name: postgres-data
      owner: 999 # postgres uid
    - name: media
      owner: studentenportal

# https://github.com/pypa/pip/issues/5366
- name: Install newer pip
  ansible.builtin.pip:
    name: pip
    state: latest
    extra_args: --user
    break_system_packages: true
  become: true
  become_user: studentenportal

# - name: Install pip packages needed for ansible and docker
#   ansible.builtin.pip:
#     name: docker-compose
#     state: latest
#     extra_args: --user
#     break_system_packages: true
#   become: true
#   become_user: studentenportal

- name: Get user information
  ansible.builtin.getent:
    database: passwd
    key: studentenportal

- name: Set up studentenportal docker containers
  community.docker.docker_compose_v2:
    project_src: ~/web/
    files: docker-compose-production.yml
  become: true
  become_user: studentenportal
  environment:
    UID: "{{ getent_passwd['studentenportal'][1] }}"
    GID: "{{ getent_passwd['studentenportal'][2] }}"

- name: Set up dehydrated account
  ansible.builtin.command:
    cmd: docker compose -f docker-compose-production.yml exec nginx dehydrated --register --accept-terms
    chdir: ~/web/
  become: true
  become_user: studentenportal
  register: res
  changed_when: "'+ Account already registered!' not in res.stdout"

- name: Do initial dehydrated run
  ansible.builtin.command:
    cmd: docker compose -f docker-compose-production.yml exec nginx dehydrated --cron
    chdir: ~/web/
  become: true
  become_user: studentenportal
  register: res
  changed_when: "'Skipping renew!' not in res.stdout"

- name: Install sqlbackup script
  ansible.builtin.copy: src=studentenportal-sqlbackup dest=/usr/local/bin mode=755
- name: Create sqlbackup directory
  ansible.builtin.file: path=/var/backups/sql state=directory
- name: Install custom systemd files
  ansible.builtin.copy: src="studentenportal-{{ item }}" dest=/etc/systemd/system/
  loop:
    - dehydrated.timer
    - dehydrated.service
    - sqlbackup.timer
    - sqlbackup.service

- name: Enable timers
  ansible.builtin.service: name="studentenportal-{{ item }}.timer" enabled=yes state=started daemon_reload=yes
  loop:
    - dehydrated
    - sqlbackup
