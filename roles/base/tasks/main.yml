---
- name: Unlock passwordstore
  ansible.builtin.assert:
    that: lookup('passwordstore', 'email/team@studentenportal.ch directory=pass/') | length > 0

- name: Update apt cache
  ansible.builtin.apt: update_cache=yes cache_valid_time=3600
- name: Install packages needed for ansible
  ansible.builtin.apt:
    pkg:
      # - python3-apt
      - python3-pip

- name: Upgrade system
  ansible.builtin.apt: upgrade=yes
- name: Add users
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: present
    groups: "{{ item.groups }}"
    shell: /bin/bash
  loop: "{{ users }}"

- name: Add SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ lookup('file', './files/id_rsa.' + item.name + '.pub') }}"
  loop: "{{ users }}"

- name: Install useful system tools
  ansible.builtin.apt:
    pkg:
      - molly-guard
      - htop

# See https://wiki.archlinux.org/index.php/Systemd/Timers#MAILTO

- name: Install systemd-email
  ansible.builtin.copy: src=systemd-email dest=/usr/local/bin/systemd-email mode=+x
- name: Install status-email@.service
  ansible.builtin.copy: src=status-email@.service dest=/etc/systemd/system/status-email@.service
