---
- name: Create remote backup-sp HTTP authentication file
  become: true
  when: inventory_hostname in groups['ins']
  community.general.htpasswd:
    path: /home/open-ost/infra/docker/data/backup-sp/.htpasswd
    name: "backup-sp"
    password: '{{ lookup("passwordstore", "vshsr/ftp-backup_backup@studentenportal.ch directory=pass/") }}'
    crypt_scheme: bcrypt
    owner: root
    group: root
    mode: "0600"

- name: Setup backup locally
  when: inventory_hostname in groups['nine']
  block:
    - name: Install restic
      ansible.builtin.apt:
        name: restic
        state: present
        update_cache: true

    - name: Create restic configuration directory
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install restic environment file
      ansible.builtin.template:
        src: restic.env.j2
        dest: /etc/restic/env
        owner: root
        group: root
        mode: "0600"

    - name: Install backup script
      ansible.builtin.template:
        src: run-restic-backup.sh.j2
        dest: /usr/local/sbin/run-restic-backup
        owner: root
        group: root
        mode: "0700"

    - name: Check whether the restic repository exists
      ansible.builtin.shell: |
        set -a
        . /etc/restic/env
        set +a
        restic cat config
      args:
        executable: /bin/bash
      register: restic_repository_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Initialize the restic repository once
      ansible.builtin.shell: |
        set -a
        . /etc/restic/env
        set +a
        restic init
      args:
        executable: /bin/bash
      when: restic_repository_check.rc != 0
      no_log: true

    - name: Install systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-backup.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Encrypted restic backup
          Wants=network-online.target
          After=network-online.target
          OnFailure=status-email@%n.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/run-restic-backup
          Nice=10
          IOSchedulingClass=best-effort


    # TODO: weekly?
    - name: Install systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-backup.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Run restic backup daily

          [Timer]
          OnCalendar=*-*-* 02:30:00
          Persistent=true
          RandomizedDelaySec=30m

          [Install]
          WantedBy=timers.target

    - name: Enable backup timer
      ansible.builtin.systemd:
        name: restic-backup.timer
        enabled: true
        state: started
        daemon_reload: true

